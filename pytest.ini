[pytest]
minversion = 7.0
testpaths =
    chimerapy
    docs
norecursedirs =
    .tox
    build
    docs/_build
    docs/generated
    *.egg-info
    examples
    chimerapy/_dev
    .history
    chimerapy/extern
doctest_plus = enabled
doctest_optionflags =
    NORMALIZE_WHITESPACE
    FLOAT_CMP
    ELLIPSIS
text_file_format = rst
addopts =
    --doctest-rst
    -p no:unraisableexception
    -p no:threadexception
filterwarnings =
    # Turn all warnings into errors so they do not pass silently.
    error
    # Do not fail on pytest config issues (i.e. missing plugins) but do show them
    always::pytest.PytestConfigWarning
    # A list of warnings to ignore follows. If you add to this list, you MUST
    # add a comment or ideally a link to an issue that explains why the warning
    # is being ignored
    # legacy code
    # numpy divide-by-zero inside the CHIMERA thresholding maths (log10/power of
    # arrays containing zeros). Pre-existing behaviour, only surfaced as an error
    # after the Python 3.12 / newer sunpy dependency bump. TODO: guard the maths.
    ignore:divide by zero encountered in log10:RuntimeWarning
    ignore:divide by zero encountered in power:RuntimeWarning
    ignore:divide by zero encountered in divide:RuntimeWarning
    ignore:invalid value encountered in log10:RuntimeWarning
    ignore:invalid value encountered in divide:RuntimeWarning
    ignore:invalid value encountered in cast:RuntimeWarning
    # matplotlib: scatter/plot call in the legacy figure code passes no colour
    # data, so cmap is ignored. Cosmetic, from the dependency bump.
    ignore:No data for colormapping provided via 'c':UserWarning
    # newer astropy warns when transforming between frames that differ by more
    # than a pure rotation; raised from the coordinate setup in
    # test_chimera.py::test_filter_by_area_size. TODO: confirm this is benign.
    ignore::astropy.coordinates.errors.NonRotationTransformationWarning
